name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # opencv-python (not the -headless variant) needs libGL at import
      # time even though this job never opens a real display.
      - name: Install system libs opencv-python needs to import
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install dependencies
        run: pip install ruff -r requirements.txt

      - name: Lint
        run: ruff check src tests

      # Import smoke check first, cheap and catches a broken import before
      # paying for a model download. Never opens a camera or a window - only
      # imports the module - so it needs no display or hardware.
      - name: Import smoke check
        run: python -c "import sys; sys.path.insert(0, 'src'); import detect"

      # detect_people() is real, testable logic now (structured output, not
      # just a display loop), so it gets a real pytest suite - runs YOLO
      # against Ultralytics' own bundled sample photo, downloading yolov8n's
      # weights (~6 MB) on first run. No camera or display needed.
      - name: Test
        run: pytest -q
